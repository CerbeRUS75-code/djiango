<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <meta charset="utf-8" />
</head>
<body>
    <h1>{{ greeting }}</h1>
    <p>{{ message }}</p>

    {% comment %}
    Демонстрация шаблонного комментария.
    {% endcomment %}

    <h2>Языки программирования</h2>
    <ul>
        {% for lan in langs %}
            <li>{{ lan }}</li>
        {% endfor %}
    </ul>

    <p>Год: {% now "Y" %}</p>
    <p>Дата: {% now "F j Y" %}</p>
    <p>Дата и время: {% now "N j, Y, P" %}</p>

    <nav>
        <a href="/about/">О нас</a> |
        <a href="/contacts/">Контакты</a>
    </nav>
</body>
</html>
